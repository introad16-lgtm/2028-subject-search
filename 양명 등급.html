<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2028 양명여고 진학 상담 프로그램</title>
    <style>
        /* 예쁜 웹 폰트 불러오기 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://webfontworld.github.io/gmarket/GmarketSans.css');
        
        /* 1. 전체 배경 (따뜻한 옐로우 톤) */
        body { 
            font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', sans-serif; 
            background: linear-gradient(135deg, #fffdf5 0%, #fff3e0 100%); 
            color: #4a4a4a; 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 2. 본문 컨테이너 (화이트 배경에 부드러운 옐로우/핑크 그림자) */
        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 50px; 
            border-radius: 28px; 
            box-shadow: 0 15px 40px rgba(255, 165, 0, 0.12); 
            border: 2px solid #ffe082; 
        }

        /* 3. 로고와 메인 제목 배치 */
        .header-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }
        
        .header-logo {
            height: 48px; /* 제목 크기와 비슷하게 로고 크기 조정 */
            width: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 { 
            font-family: 'GmarketSans', sans-serif; 
            background: linear-gradient(to right, #e65100, #e91e63); /* 오렌지에서 핑크로 이어지는 그라데이션 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 34px; 
            font-weight: bold;
            margin: 0; 
            letter-spacing: -1px;
            text-shadow: 2px 2px 4px rgba(230, 81, 0, 0.1); 
        }
        
        h4 {
            text-align: center; 
            color: #ff9800; /* 산뜻한 오렌지 옐로우 */
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* 4. 안내 뱃지 디자인 */
        .school-badge { 
            display: block; 
            text-align: center; 
            background-color: #fff8e1; /* 연노랑 배경 */
            color: #d84315; /* 진한 오렌지 글씨 */
            font-weight: 800; 
            padding: 22px; 
            border-radius: 15px; 
            margin-bottom: 30px; 
            font-size: 16px; 
            border: 1px solid #ffe082; 
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.1);
        }

        .alert-badge { 
            display: inline-block; 
            background: linear-gradient(135deg, #ffca28, #ff9800); 
            color: #fff; 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 14px; 
            margin-top: 10px; 
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3);
        }
        
        /* 5. 교과/종합 탭 버튼 (옐로우 & 핑크) */
        .toggle-section { display: flex; justify-content: center; margin-bottom: 35px; gap: 20px; }
        .toggle-btn { 
            flex: 1; 
            max-width: 280px; 
            padding: 16px 20px; 
            font-size: 19px; 
            font-weight: 800; 
            text-align: center; 
            border: 2px solid #ffe082; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            background: #fff; 
            color: #f57c00; 
        }
        .toggle-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 152, 0, 0.15); }

        /* 교과 전형 활성화 (옐로우/오렌지) */
        .toggle-btn.active-gyogwa { 
            border-color: transparent; 
            background: linear-gradient(135deg, #ffca28, #ff9800); 
            color: #fff; 
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3); 
        }
        /* 종합 전형 활성화 (코랄 핑크) */
        .toggle-btn.active-jonghap { 
            border-color: transparent; 
            background: linear-gradient(135deg, #f06292, #e91e63); 
            color: #fff; 
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3); 
        }
        
        /* 6. 성적 입력 영역 */
        .input-section { background: #fffdf5; padding: 35px; border-radius: 20px; border: 2px dashed #ffe082; margin-bottom: 35px; }
        .slider-group { margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; transition: opacity 0.3s; }
        .slider-group.disabled { opacity: 0.35; }
        .slider-group.disabled .slider-input, .slider-group.disabled .number-input { pointer-events: none; }
        
        .slider-label { font-weight: 800; color: #5d4037; width: 190px; font-size: 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .slider-input { flex: 1; margin: 0 25px; }
        
        /* 컨트롤 컬러 변경 (옐로우 오렌지) */
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff9800; } 
        input[type=checkbox] { width: 24px; height: 24px; cursor: pointer; accent-color: #ff9800; }
        
        .number-input { 
            width: 95px; 
            padding: 10px; 
            font-size: 18px; 
            text-align: center; 
            border: 2px solid #ffcc80; 
            border-radius: 10px; 
            font-weight: 800; 
            color: #e65100; 
            background: #fff; 
            transition: all 0.3s;
        }
        .number-input:focus { outline: none; border-color: #ff9800; box-shadow: 0 0 10px rgba(255, 152, 0, 0.2); }

        /* 7. 결과 점수 섹션 */
        .result-section { display: flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 45px; background: #fff; padding: 30px; border-radius: 20px; border: 1px solid #ffecb3; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .grade-item { text-align: center; flex: 1; }
        .grade-title { font-size: 16px; color: #d84315; font-weight: 800; margin-bottom: 12px; }
        
        .grade-value-5 { font-family: 'GmarketSans', sans-serif; font-size: 56px; font-weight: bold; color: #ff9800; text-shadow: 2px 2px 4px rgba(255, 152, 0, 0.15); }
        .grade-value-9 { font-family: 'GmarketSans', sans-serif; font-size: 56px; font-weight: bold; color: #e91e63; text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.15); }
        .vs-badge { font-size: 22px; font-weight: 900; color: #fff; padding: 15px; background: linear-gradient(135deg, #ffb300, #f06292); border-radius: 50%; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.2); }

        /* 8. 컬러 게이지 바 */
        .gauge-wrapper { padding: 0 20px; margin-bottom: 60px; }
        .gauge-container { position: relative; width: 100%; height: 26px; background: linear-gradient(to right, #fff59d, #ffca28, #ff9800, #f06292, #c2185b); border-radius: 13px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.15); }
        .gauge-marker { position: absolute; top: -12px; width: 6px; height: 50px; background: #3e2723; border-radius: 3px; transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .gauge-marker::after { content: '내 위치'; position: absolute; top: -35px; left: -28px; width: 60px; text-align: center; font-size: 13px; font-weight: bold; color: #fff; background: #3e2723; padding: 4px 0; border-radius: 6px; }
        .gauge-labels { display: flex; justify-content: space-between; margin-top: 12px; font-size: 14px; color: #d84315; font-weight: 800; }

        /* 9. 대학교 결과 카드 */
        .card-univ { border: 3px solid transparent; padding: 40px; border-radius: 20px; text-align: center; transition: all 0.4s; background: #fff; }
        
        .card-univ.gyogwa { border-color: #ffca28; box-shadow: 0 15px 35px rgba(255, 152, 0, 0.12); background: linear-gradient(to bottom, #fff, #fffdf5); }
        .card-univ.jonghap { border-color: #f06292; box-shadow: 0 15px 35px rgba(233, 30, 99, 0.12); background: linear-gradient(to bottom, #fff, #fff0f3); }
        
        .card-univ .card-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; }
        .card-univ.gyogwa .card-title { color: #f57f17; }
        .card-univ.jonghap .card-title { color: #d81b60; }
        
        .card-univ .card-value { font-family: 'GmarketSans', sans-serif; font-size: 34px; font-weight: bold; line-height: 1.4; margin-bottom: 15px; color: #3e2723; }
        .card-univ .card-desc { font-size: 17px; color: #e65100; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-wrapper">
        <img src="logo.jpeg" alt="양명여고 로고" class="header-logo">
        <h1>2028 대입 교과/종합 진학 상담</h1>
        <img src="logo.jpeg" alt="양명여고 로고" class="header-logo">
    </div>
    <h4>♥ 양명여고 진로진학부 ♥</h4>

    <div class="school-badge">
         [2026 대입 주요대학 3개년 컷오프] 데이터 분석 적용<br>
        <span class="alert-badge">✨ 산출된 5등급제 평균에서 0.05를 빼서 보정 내합니다.</span>
    </div>
    
    <div class="toggle-section">
        <div class="toggle-btn active-gyogwa" id="btn-gyogwa" onclick="setMode('gyogwa')">📘 학생부 교과 전형</div>
        <div class="toggle-btn" id="btn-jonghap" onclick="setMode('jonghap')">📙 학생부 종합 전형</div>
    </div>

    <div class="input-section">
        <div class="slider-group">
            <div class="slider-label">1학년 1학기 (5등급)</div>
            <div class="slider-input"><input type="range" id="s1" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('s1', 'n1')"></div>
            <input type="number" id="n1" class="number-input" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('n1', 's1')">
        </div>
        <div class="slider-group disabled" id="g2">
            <label class="slider-label" for="c2"><input type="checkbox" id="c2" onchange="toggle(2)"> 1학년 2학기</label>
            <div class="slider-input"><input type="range" id="s2" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('s2', 'n2')"></div>
            <input type="number" id="n2" class="number-input" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('n2', 's2')">
        </div>

        <hr style="border:0; border-top:2px dashed #ffe082; margin: 25px 0;">

        <div class="slider-group disabled" id="g3">
            <label class="slider-label" for="c3"><input type="checkbox" id="c3" onchange="toggle(3)"> 2학년 1학기</label>
            <div class="slider-input"><input type="range" id="s3" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('s3', 'n3')"></div>
            <input type="number" id="n3" class="number-input" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('n3', 's3')">
        </div>
        <div class="slider-group disabled" id="g4">
            <label class="slider-label" for="c4"><input type="checkbox" id="c4" onchange="toggle(4)"> 2학년 2학기</label>
            <div class="slider-input"><input type="range" id="s4" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('s4', 'n4')"></div>
            <input type="number" id="n4" class="number-input" min="1.0" max="5.0" step="0.001" value="1.528" oninput="sync('n4', 's4')">
        </div>
    </div>

    <div class="result-section">
        <div class="grade-item">
            <div class="grade-title">🆕 현행 (5등급) 평균 <br><span style="font-size:13px; color:#f57f17;">(-0.05 긍정적 보정)</span></div>
            <div class="grade-value-5" id="res5">1.478</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="grade-item">
            <div class="grade-title">⏳ 9등급제 환산</div>
            <div class="grade-value-9" id="res9">2.345</div>
        </div>
    </div>

    <div class="gauge-wrapper">
        <div class="gauge-container"><div class="gauge-marker" id="marker"></div></div>
        <div class="gauge-labels"><span>1.0 극상위</span><span>2.0 상위</span><span>3.0 중위</span><span>4.0 하위</span><span>5.0</span></div>
    </div>

    <div class="card-univ gyogwa" id="univ-card">
        <div class="card-title" id="univ-title">🏫 일반고 [교과 전형] 합격 예상 라인</div>
        <div class="card-value" id="univ">국숭세단 및 과기대</div>
        <div class="card-desc" id="univ-desc">국민대, 숭실대, 세종대, 단국대, 서울과학기술대 등</div>
    </div>
</div>

<script>
    // 기능 로직은 기존과 100% 동일하게 유지됩니다.
    let mode = 'gyogwa';

    function setMode(newMode) {
        mode = newMode;
        if(mode === 'gyogwa') {
            document.getElementById('btn-gyogwa').className = 'toggle-btn active-gyogwa';
            document.getElementById('btn-jonghap').className = 'toggle-btn';
            document.getElementById('univ-card').className = 'card-univ gyogwa';
            document.getElementById('univ-title').innerText = '🏫 일반고 [교과 전형] 합격 예상 라인';
        } else {
            document.getElementById('btn-jonghap').className = 'toggle-btn active-jonghap';
            document.getElementById('btn-gyogwa').className = 'toggle-btn';
            document.getElementById('univ-card').className = 'card-univ jonghap';
            document.getElementById('univ-title').innerText = '🏫 일반고 [종합 전형] 합격 예상 라인';
        }
        calc();
    }

    function sync(src, dst) { 
        let val = parseFloat(document.getElementById(src).value);
        if(isNaN(val)) return; 
        document.getElementById(dst).value = val.toFixed(3); 
        calc(); 
    }
    
    function toggle(n) { 
        const isChecked = document.getElementById('c' + n).checked;
        const group = document.getElementById('g' + n);
        isChecked ? group.classList.remove('disabled') : group.classList.add('disabled');
        calc(); 
    }
    
    function map5to9(g5) {
        const points = [
            [1.000, 1.000], 
            [1.100, 1.350], 
            [1.200, 1.650], 
            [1.310, 1.990], 
            [1.478, 2.345], 
            [1.715, 2.753], 
            [2.004, 3.261], 
            [3.000, 6.000], 
            [5.000, 9.000]
        ];
        if (g5 <= 1.000) return 1.000;
        if (g5 >= 5.000) return 9.000;
        
        for (let i = 0; i < points.length - 1; i++) {
            if (g5 >= points[i][0] && g5 <= points[i+1][0]) {
                let r = (g5 - points[i][0]) / (points[i+1][0] - points[i][0]);
                return points[i][1] + r * (points[i+1][1] - points[i][1]);
            }
        }
        return 9.000;
    }

    function calc() {
        let v1 = parseFloat(document.getElementById('n1').value);
        let v2 = parseFloat(document.getElementById('n2').value);
        
        if(isNaN(v1)) v1 = 1.0; 
        if(isNaN(v2)) v2 = 1.0;

        let sum = v1;
        let count = 1;
        
        if(document.getElementById('c2').checked) { 
            let v2 = parseFloat(document.getElementById('n2').value);
            if(!isNaN(v2)) { sum += v2; count++; }
        }
        if(document.getElementById('c3').checked) { 
            let v3 = parseFloat(document.getElementById('n3').value);
            if(!isNaN(v3)) { sum += v3; count++; }
        }
        if(document.getElementById('c4').checked) { 
            let v4 = parseFloat(document.getElementById('n4').value);
            if(!isNaN(v4)) { sum += v4; count++; }
        }
        
        let raw_avg = sum / count;
        let avg5 = raw_avg - 0.050;
        
        if(avg5 < 1.0) avg5 = 1.0; 
        if(avg5 > 5.0) avg5 = 5.0;

        let avg9 = map5to9(avg5);

        document.getElementById('res5').innerText = avg5.toFixed(3);
        document.getElementById('res9').innerText = avg9.toFixed(3) + " 등급";
        document.getElementById('marker').style.left = ((avg5 - 1.0) / 4.0 * 100) + "%";

        let u = "", desc = "";
        
        if (mode === 'gyogwa') {
            if(avg9 <= 1.400) { u = "SKY 및 핵심 과기원"; desc = "서울대, 연세대, 고려대, 카이스트 등"; }
            else if(avg9 <= 1.700) { u = "서성한 라인"; desc = "서강대, 성균관대, 한양대, 포스텍 등"; }
            else if(avg9 <= 1.900) { u = "중경외시이 라인"; desc = "중앙대, 경희대, 한국외대, 서울시립대, 이화여대 등"; }
            else if(avg9 <= 2.200) { u = "건동홍숙 및 교육대"; desc = "건국대, 동국대, 홍익대, 숙명여대, 교대 등"; }
            else if(avg9 <= 2.600) { u = "국숭세단 및 과기대"; desc = "국민대, 숭실대, 세종대, 단국대, 서울과학기술대 등"; }
            else if(avg9 <= 3.100) { u = "광명상가 및 지거국 상위"; desc = "광운대, 명지대, 상명대, 가톨릭대, 부산대, 경북대 등"; }
            else if(avg9 <= 3.600) { u = "인가경 및 수도권 주요"; desc = "인천대, 가천대, 경기대, 충남대, 전남대 등"; }
            else if(avg9 <= 4.200) { u = "수도권 중위 및 지거국"; desc = "수원대, 강남대, 안양대, 강원대, 전북대 등"; }
            else { u = "기타 지역 사립 및 전문대"; desc = "전국 권역별 일반 학생 전형"; }
        } else {
            if(avg9 <= 1.700) { u = "SKY 및 핵심 과기원"; desc = "서울대, 연세대, 고려대, 카이스트 등"; }
            else if(avg9 <= 2.100) { u = "서성한 라인"; desc = "서강대, 성균관대, 한양대, 포스텍 등"; }
            else if(avg9 <= 2.500) { u = "중경외시이 라인"; desc = "중앙대, 경희대, 한국외대, 서울시립대, 이화여대 등"; }
            else if(avg9 <= 2.800) { u = "건동홍숙 및 교육대"; desc = "건국대, 동국대, 홍익대, 숙명여대, 교대 등"; }
            else if(avg9 <= 3.200) { u = "국숭세단 및 과기대"; desc = "국민대, 숭실대, 세종대, 단국대, 서울과학기술대 등"; }
            else if(avg9 <= 3.600) { u = "광명상가 및 지거국 상위"; desc = "광운대, 명지대, 상명대, 가톨릭대, 부산대, 경북대 등"; }
            else if(avg9 <= 4.200) { u = "인가경 및 수도권 주요"; desc = "인천대, 가천대, 경기대, 충남대, 전남대 등"; }
            else if(avg9 <= 4.800) { u = "수도권 중위 및 지거국"; desc = "수원대, 강남대, 안양대, 강원대, 전북대 등"; }
            else { u = "기타 지역 사립 및 전문대"; desc = "전국 권역별 일반 학생 전형"; }
        }
        
        document.getElementById('univ').innerText = u;
        document.getElementById('univ-desc').innerText = desc;
    }
    
    window.onload = calc;
</script>
</body>
</html>
